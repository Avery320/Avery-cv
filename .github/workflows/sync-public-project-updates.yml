name: Sync public project updates

on:
  schedule:
    - cron: "17 3 * * *"
      timezone: "Asia/Taipei"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: public-project-updates
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Read latest public project commits
        run: node scripts/sync-public-project-updates.mjs

      - name: Check for timestamp changes
        id: changes
        run: |
          if git diff --quiet -- src/data/project-updates.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit timestamp changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/project-updates.json
          git commit -m "chore: update public project timestamps"
          git push

      - name: Deploy updated portfolio
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
